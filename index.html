<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Verified Chat App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #3ecf8e; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #34b27b; }
        .hidden { display: none !important; }
        .error { color: #ff4d4d; font-size: 14px; margin-top: 10px; }
        .info { color: #007bff; font-size: 14px; margin-top: 10px; }
        #chat-screen { width: 450px; height: 500px; display: flex; flex-direction: column; text-align: left; }
        .chat-messages { flex: 1; border: 1px solid #eee; border-radius: 6px; padding: 10px; overflow-y: auto; margin-bottom: 10px; background: #fafafa; }
    </style>
</head>
<body>

    <div id="auth-screen" class="card">
        <h2>Welcome to ChatApp</h2>
        <p>Register with a real email to access chat.</p>
        <input type="email" id="email" placeholder="Enter your email" />
        <input type="password" id="password" placeholder="Enter password" />
        <button onclick="handleSignUp()">Sign Up</button>
        <button onclick="handleSignIn()" style="background: #6c757d; margin-top: 8px;">Already Verified? Login</button>
        <div id="auth-msg" class="error"></div>
    </div>

    <div id="verification-wall" class="card hidden">
        <h2>Check Your Email ✉️</h2>
        <p>We've sent a verification link to <b id="user-email-display"></b>.</p>
        <p style="font-size: 13px; color: #666;">You must click the link in your inbox before you can access the chat rooms.</p>
        <button onclick="checkVerificationStatus()">I've Verified, Let Me In</button>
        <button onclick="resendEmail()" style="background: #6c757d; margin-top: 8px;">Resend Email</button>
        <button onclick="logout()" style="background: #dc3545; margin-top: 8px;">Logout</button>
        <div id="verify-msg" class="info"></div>
    </div>

    <div id="chat-screen" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            <h3>Live Chat Room</h3>
            <button onclick="logout()" style="width: auto; background: #dc3545; padding: 5px 10px; font-size: 12px;">Logout</button>
        </div>
        <div class="chat-messages" id="message-list">
            <p style="color: #888; text-align: center; font-size: 13px;">Welcome! You are verified and connected.</p>
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Type a message..." style="margin: 0;" />
            <button onclick="sendMessage()" style="width: 80px; margin: 0;">Send</button>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // UI elements
        const authScreen = document.getElementById('auth-screen');
        const verificationWall = document.getElementById('verification-wall');
        const chatScreen = document.getElementById('chat-screen');
        const authMsg = document.getElementById('auth-msg');
        const verifyMsg = document.getElementById('verify-msg');
        const userEmailDisplay = document.getElementById('user-email-display');

        // Check active session on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                routeUser(session.user);
            }
        });

        // Handle routing based on confirmation status
        function routeUser(user) {
            authScreen.classList.add('hidden');
            
            // Check if email_confirmed_at exists
            if (!user.email_confirmed_at) {
                userEmailDisplay.innerText = user.email;
                verificationWall.classList.remove('hidden');
                chatScreen.classList.add('hidden');
            } else {
                verificationWall.classList.add('hidden');
                chatScreen.classList.remove('hidden');
            }
        }

        // Sign Up Flow
        async function handleSignUp() {
            authMsg.innerText = '';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { emailRedirectTo: window.location.origin }
            });

            if (error) {
                authMsg.innerText = error.message;
                return;
            }

            if (data.user) {
                routeUser(data.user);
            }
        }

        // Login Flow
        async function handleSignIn() {
            authMsg.innerText = '';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                authMsg.innerText = error.message;
                return;
            }

            if (data.user) {
                routeUser(data.user);
            }
        }

        // Manual refresh button check for email verification status
        async function checkVerificationStatus() {
            verifyMsg.innerText = "Checking...";
            const { data: { user }, error } = await supabase.auth.getUser();
            
            if (error || !user) {
                logout();
                return;
            }

            // Refresh user session state
            await supabase.auth.refreshSession();
            
            if (user.email_confirmed_at) {
                routeUser(user);
            } else {
                verifyMsg.innerText = "Email not verified yet. Please check your inbox and click the link.";
            }
        }

        // Resend confirmation email
        async function resendEmail() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                await supabase.auth.resend({
                    type: 'signup',
                    email: user.email,
                });
                verifyMsg.innerText = "Verification email resent! Check your inbox.";
            }
        }

        // Logout
        async function logout() {
            await supabase.auth.signOut();
            chatScreen.classList.add('hidden');
            verificationWall.classList.add('hidden');
            authScreen.classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Dummy frontend chat send function (Integrate with Supabase DB insertions next)
        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;

            const list = document.getElementById('message-list');
            const p = document.createElement('p');
            p.style.margin = "5px 0";
            p.innerHTML = `<b>You:</b> ${input.value}`;
            list.appendChild(p);
            input.value = '';
            list.scrollTop = list.scrollHeight;
        }
    </script>
</body>
</html>
