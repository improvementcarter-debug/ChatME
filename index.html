
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatME! - Debug Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f111a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .card { background: #181b28; padding: 30px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #2a2e43; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #232738; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #ec4899; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .error-box { color: #f87171; font-size: 13px; margin-top: 10px; word-break: break-word; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-card" class="card">
        <h2 id="form-title" style="color: #ec4899;">ChatME! Register</h2>
        <input type="email" id="email" placeholder="Real Email Address" />
        <input type="password" id="password" placeholder="Password" />
        
        <button id="action-btn" onclick="handleSubmit()">Register Account</button>
        <button onclick="toggleMode()" style="background: #374151; margin-top: 8px;" id="switch-btn">Already verified? Switch to Sign In</button>
        
        <div id="error-display" class="error-box"></div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-card" class="card hidden" style="width: 400px; text-align: left;">
        <h3 style="color: #ec4899; margin-top:0;">ChatME! Room (Verified)</h3>
        <p style="font-size: 13px; color: #9ca3af;">You are verified and logged in successfully!</p>
        <button onclick="handleLogout()" style="background: #ef4444;">Logout</button>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE DETAILS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = false;

        async function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? "ChatME! Sign In" : "ChatME! Register";
            document.getElementById('action-btn').innerText = isLoginMode ? "Sign In" : "Register Account";
            document.getElementById('switch-btn').innerText = isLoginMode ? "Need an account? Register Here" : "Already verified? Switch to Sign In";
            document.getElementById('error-display').innerText = "";
        }

        async function handleSubmit() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-display');
            errorBox.innerText = "";

            if (!email || !password) {
                errorBox.innerText = "Please fill in all fields.";
                return;
            }

            if (!isLoginMode) {
                // REGISTRATION FLOW
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { emailRedirectTo: window.location.origin }
                });

                if (error) {
                    errorBox.innerText = error.message;
                    return;
                }

                alert("Success! Check your real email inbox for the verification link before signing in.");
                isLoginMode = true;
                toggleMode();
            } else {
                // SIGN IN FLOW
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errorBox.innerText = error.message;
                    return;
                }

                const user = data.user;
                if (user && !user.email_confirmed_at) {
                    errorBox.innerText = "Access Denied: You must click the email verification link first!";
                    await supabase.auth.signOut();
                    return;
                }

                // Verified - Load Chat Screen
                document.getElementById('auth-card').classList.add('hidden');
                document.getElementById('chat-card').classList.remove('hidden');
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            document.getElementById('chat-card').classList.add('hidden');
            document.getElementById('auth-card').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Check if already logged in and verified on page refresh
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (user && user.email_confirmed_at) {
                document.getElementById('auth-card').classList.add('hidden');
                document.getElementById('chat-card').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
